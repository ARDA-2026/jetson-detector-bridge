udp:
  host: "0.0.0.0"
  port: 9999
  timeout: 0.5      # 초 — recv() 논블로킹 폴링 주기

servo:
  gpio_pin: 33          # Jetson 40핀 헤더 물리 핀 번호 (BOARD 모드, PWM 지원 핀)
  min_deg: 0.0
  max_deg: 180.0
  center_deg: 90.0      # 레이더 정면(azimuth=0)에 대응하는 서보 각도이자 시작 시
                         # 1회만 이동하는 초기 위치. 이후로는 dwell이 끝나도 이
                         # 각도로 돌아가지 않는다 — 서보는 트리거가 있을 때만
                         # 움직이고, 그 외에는 항상 마지막 각도에 그대로 멈춘다.
  invert: false           # 배선/장착 방향에 따라 좌우가 반대로 움직이면 true로 변경 —
                         # 실치 재설치로 서보 방향이 앞뒤(좌우)로 뒤집혀서 true로 전환.
                         # xyz_to_pan_angle/pan_angle_to_xyz(레이더 좌표→각도)와
                         # _apply_thermal_pan(열화상 보정 방향) 양쪽 다 이 값 하나로 뒤집힘.
  dwell_seconds: 10.0    # 낙하(fall=true) 좌표 수신 시 그 각도에서 정지해 있을 시간(초).
                         # 끝나도 홈으로 복귀하지 않고 그 각도에 그대로 멈춘다.
                         # 열화상(arda-thermal-test) 판정 시간을 벌어주는 용도 —
                         # 열화상 쪽 dwell-seconds와 비슷하거나 살짝 길게 맞춘다. 0이면 비활성화.

# 서보가 레이더 대비 설치된 위치 차이 (m, 레이더 좌표계 기준)
# 예: 서보가 레이더보다 오른쪽 0.2m, 앞쪽 0.1m, 아래쪽 0.3m에 설치됐다면
# x: 0.2, y: 0.1, z: -0.3. 같은 위치에 있으면 0으로 둔다.
#
# 주의: z(상하 오프셋)는 현재 팬(pan) 1축 각도 계산에는 반영되지 않는다.
# 좌우로만 회전하는 팬 각도는 수평(x,y) 차이로만 정해지고 높이 차이의
# 영향을 받지 않기 때문이다(카메라를 아래로 고정 기울여 달아도 마찬가지).
# 시작 시 로그로만 확인되며, 나중에 tilt 축을 추가하면 그 elevation 계산에
# 사용한다.
mount_offset:
  x: 0.0
  y: 0.0
  z: 1.0

# 열화상(arda-thermal-test)이 보내는 발열 방향 보정값 수신 설정.
# 이 섹션 전체를 지우면 열화상 추적 기능이 비활성화되고 기존처럼
# 레이더 낙하 좌표 → dwell → 그 각도에 정지만 동작한다.
thermal_udp:
  host: "0.0.0.0"
  port: 9996
  timeout: 0.01        # 초 — recv() 논블로킹 폴링 주기 (레이더 좌표 수신을 막지 않음)
  pan_gain_deg: 8.0     # 보정 1건(offset -1.0~1.0)당 최대 회전 각도(도).
                         # dwell 중에만 적용되며, 보정이 들어올 때마다 dwell_seconds만큼
                         # 대기 시간을 연장한다 — 열원이 계속 보이는 동안 계속 추적하다가
                         # 보정이 끊기면 dwell 만료 후 그 각도에 그대로 멈춘다(홈 복귀 없음).

# 사람 확정(confirmed) 시 최종 좌표의 거리를 "카메라가 z=0 평면(지면/수면)을
# 보고 있다"는 가정으로 열화상의 세로(행) 위치로부터 역산하기 위한 설치
# 정보. install_height_m은 radar_height_m + height_offset_from_radar_m으로
# 계산된다. 필요한 값(radar_height_m/tilt_deg/vertical_fov_deg)이 모두 있고
# 열화상이 vertical_offset도 함께 보낼 때만 사용하며, 없으면 기존처럼
# 레이더가 처음 잰 거리를 그대로 쓴다.
camera_geometry:
  radar_height_m: 1.3            # 레이더 설치 높이(z=0 기준, m). arda-radar는 site.lat/lon/
                                   # heading_deg만 쓰고 높이(Z)는 다루지 않으므로, 이 값은
                                   # arda-radar 설정에서 가져올 수 없고 설치 시 직접 실측할 것
  height_offset_from_radar_m: -0.1  # 카메라가 레이더보다 설치된 높이 차이(m). 레이더보다
                                      # 낮으면 음수, 높으면 양수 — install_height_m =
                                      # radar_height_m + height_offset_from_radar_m
  tilt_deg: 50.0          # 수평 기준 아래로 기울어진 각도(도) — 프레임 세로 중심(정지 상태)의 앙각
  vertical_fov_deg: 55.0  # MLX90640 Standard 렌즈 화각(55°x35°) 중 지금 세로축에 해당하는 값.
                           # 열화상 하우징이 원래 방향에서 시계방향으로 90도 돌아가 장착돼
                           # 가로/세로 화각이 서로 바뀌었다 — 원래는 세로가 35°(좁은 축)였지만
                           # 지금은 55°(넓은 축)가 세로가 됐다(thermal-camera의 WIDTH/HEIGHT
                           # 회전 보정, thermal_main.py의 ROTATE_90_CCW 참고). 카메라를 원래
                           # 방향으로 재장착하면 35.0으로 되돌릴 것.

# 레이더 설치 지점의 GPS 위도/경도와 정면 방위각. 사람 확정(confirmed) 시
# 좌표를 로컬 미터 대신 위경도로 로그에 남기기 위한 설정이다. arda-radar와
# 완전히 분리된 프로젝트라 값을 직접 읽어오지 않으므로, arda-radar의
# config/settings.yaml site 섹션과 같은 값으로 수동으로 맞춰둘 것. 없으면
# 기존처럼 레이더 기준 로컬 좌표(m)로 로그에 남는다.
#
# ⚠️ lat/lon/heading_deg(및 report_url)는 arda-raset(main.py)이 raset으로
# 실행할 때는 더 이상 읽지 않는다 — arda-raset/main.py 상단의
# DEFAULT_SITE_LAT/DEFAULT_SITE_LON/DEFAULT_SITE_HEADING_DEG(또는
# --site-lat 등 실행 인자)로 하나로 통일했다. 여기 값은 arda-servo를 이
# 저장소 단독으로 실행할 때만(main.py) 실제로 쓰인다.
site:
  lat: 37.5336        # 설치 지점 위도 (도, WGS84)
  lon: 126.9364        # 설치 지점 경도 (도, WGS84)
  heading_deg: 320.0    # 레이더 정면(Y축)이 향하는 나침반 방위각

  # 열화상 추적으로 보정된 최종 낙하 위치를 이 엔드포인트로 POST한다
  # (arda_servo/utils/web_report.py의 send_fall_report 참고, arda-algo_general의
  # POST /report에 맞춰서 쓴다). 빈 문자열이면 전송하지 않는다(로그만 남김).
  #
  # ⚠️ 이 값은 arda-servo를 raset 없이 이 저장소 단독으로 실행할 때만
  # (arda-servo/main.py) 쓰인다 — arda-raset(main.py)으로 실행할 때는 이
  # 값을 안 읽고, arda-raset/main.py 상단의 DEFAULT_REPORT_URL/--report-url을
  # 대신 쓴다(열화상 스트리밍과 낙하 확정 좌표가 항상 같은 주소로 나가도록
  # 하나로 통일함 — 예전엔 여기와 arda-radar 쪽 값이 따로 있어서 둘이
  # 어긋난 적이 있었다). 단독 실행 시에는 여기 값을 고칠 것.
  report_url: "http://172.30.139.125:8000/report"
